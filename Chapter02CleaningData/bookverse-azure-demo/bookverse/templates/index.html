<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookVerse · Recommendations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body>
  <div class="bg-orbs"><span></span><span></span><span></span></div>

  <!-- ============ LOGIN ============ -->
  <section id="login" class="login hidden">
    <div class="login-card glass">
      <div class="brand big">📚 <span>BookVerse</span></div>
      <p class="muted">A data-science powered book &amp; reader recommender.<br>Pick a demo reader to sign in.</p>
      <div class="profiles">
        <button class="profile-pick" data-user="alice">
          <div class="avatar xl" style="--h:280">AS</div>
          <b>Alice</b><small>Fantasy · Sci-Fi fan</small>
        </button>
        <button class="profile-pick" data-user="bob">
          <div class="avatar xl" style="--h:190">BM</div>
          <b>Bob</b><small>Mystery · Thriller fan</small>
        </button>
      </div>
      <form id="loginForm">
        <input id="username" placeholder="Username" autocomplete="username" required>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="btn primary wide" type="submit">Sign in</button>
        <p id="loginError" class="error"></p>
      </form>
      <p class="hint">Demo accounts: <code>alice / alice123</code> &nbsp;·&nbsp; <code>bob / bob123</code></p>
    </div>
  </section>

  <!-- ============ APP ============ -->
  <div id="app" class="app hidden">
    <aside class="sidebar glass">
      <div class="brand">📚 <span>BookVerse</span></div>
      <nav id="nav">
        <div class="nav-label">Discover</div>
        <button data-view="foryou" class="nav-btn">✨ <span>Books You May Like</span></button>
        <button data-view="people" class="nav-btn">🤝 <span>People You May Know</span></button>
        <button data-view="trending" class="nav-btn">🔥 <span>Trending Now</span></button>
        <div class="nav-label">Genres</div>
        <div id="genreNav" class="genre-nav"></div>
        <div class="nav-label">You</div>
        <button data-view="shelf" class="nav-btn">📖 <span>My Shelf</span></button>
        <button data-view="insights" class="nav-btn">📊 <span>Data Insights</span></button>
      </nav>
      <div class="feed">
        <div class="nav-label">Live activity <span class="pulse"></span></div>
        <ul id="feed"></ul>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search glass">
          <span>🔎</span><input id="search" placeholder="Search books or authors…">
        </div>
        <div class="top-actions">
          <button id="watchBtn" class="btn glass watch">
            <span class="dot" id="partnerDot"></span> <span id="watchLabel">See what partner sees</span>
          </button>
          <div class="me glass">
            <div id="meAvatar" class="avatar"></div>
            <div class="me-text"><b id="meName"></b><small id="meCity"></small></div>
            <button id="logoutBtn" class="icon-btn" title="Sign out">⎋</button>
          </div>
        </div>
      </header>

      <section class="hero">
        <div>
          <h1 id="viewTitle">Welcome</h1>
          <p id="viewSubtitle" class="muted"></p>
        </div>
      </section>
      <section id="content" class="content"></section>
    </main>

    <!-- live mirror drawer -->
    <aside id="live" class="live glass">
      <div class="live-head">
        <div>
          <div class="live-kicker">👀 LIVE SCREEN</div>
          <b id="liveName">Partner</b>
          <small id="liveStatus" class="muted">connecting…</small>
        </div>
        <button id="liveClose" class="icon-btn">✕</button>
      </div>
      <div class="live-screen">
        <div class="live-bar"><i></i><i></i><i></i><span id="liveViewTitle">—</span></div>
        <div id="liveBody" class="live-body"></div>
      </div>
    </aside>
  </div>

  <!-- book modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-card glass">
      <button class="icon-btn modal-close" id="modalClose">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
