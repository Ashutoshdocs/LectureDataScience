[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textkit-demo"            # name used by pip (can differ from the import name)
version = "0.1.0"
description = "A tiny teaching package for text utilities"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []                # e.g. ["requests>=2.0"]

[project.scripts]
# Creates a terminal command `textkit` that calls textkit.cli:main
textkit = "textkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
