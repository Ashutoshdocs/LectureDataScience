<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazeCalc Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <h1>🔥 BlazeCalc <span id="version"></span></h1>
      <p class="subtitle">This UI lives in <code>frontend-app/</code>. All the math comes from the <code>BlazeCalc</code> module.</p>

      <div class="calculator">
        <input id="display" type="text" placeholder="e.g. 12 + 3 * 4" autocomplete="off" />
        <div class="keys" id="keys"></div>
      </div>

      <p id="error" class="error" role="alert"></p>

      <section>
        <h2>History</h2>
        <ul id="history"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
