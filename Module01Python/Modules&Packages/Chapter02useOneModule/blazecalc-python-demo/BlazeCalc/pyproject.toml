[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blazecalc"            # the name pip knows it by
version = "1.0.0"
description = "BlazeCalc - a tiny, reusable calculator module"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]               # the importable package lives in src/BlazeCalc
